name: Build KotletLandAC
on:
  push:
    paths:
      - 'KotletLandAC/**'
      - '.github/workflows/kotletland-ac.yml'
  pull_request:
    paths:
      - 'KotletLandAC/**'
      - '.github/workflows/kotletland-ac.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KotletLandAC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: gradle test build --no-daemon
