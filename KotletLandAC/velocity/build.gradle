plugins {
    id 'java'
}

group = 'ir.kotletland'
version = rootProject.version

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

// The wire format is compiled from the backend plugin's own source so both sides always agree.
sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', '../src/main/java']
            include 'ir/kotletland/acv/**'
            include 'ir/kotletland/ac/wire/**'
        }
    }
}

dependencies {
    compileOnly 'com.velocitypowered:velocity-api:3.3.0-SNAPSHOT'
    annotationProcessor 'com.velocitypowered:velocity-api:3.3.0-SNAPSHOT'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
